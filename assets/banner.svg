<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- rejilla de puntos de fondo -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#1e293b"/>
    </pattern>

    <!-- resplandor naranja detrás del escudo -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>

    <!-- separador vertical que se desvanece en los extremos -->
    <linearGradient id="divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff9900" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </linearGradient>

    <!-- banda del escaneo: brilla en el centro y se apaga hacia arriba -->
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0.35"/>
    </linearGradient>

    <path id="shield" d="M55 0 L110 20 V62 C110 98 86 120 55 132 C24 120 0 98 0 62 V20 Z"/>
    <clipPath id="shield-clip">
      <use href="#shield"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <circle cx="408" cy="150" r="160" fill="url(#glow)"/>

  <!-- escudo con cerradura, escalado y centrado sobre el resplandor -->
  <g transform="translate(342, 71) scale(1.2)">
    <!-- halo que late alrededor del escudo -->
    <use href="#shield" fill="none" stroke="#ff9900" stroke-linejoin="round">
      <animate attributeName="stroke-width" values="6; 22; 6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4; 0; 0.4" dur="2.4s" repeatCount="indefinite"/>
    </use>
    <use href="#shield" fill="#0f172a"/>

    <!-- barrido de escaneo de arriba abajo, recortado a la forma del escudo -->
    <g clip-path="url(#shield-clip)">
      <g>
        <rect x="0" y="-40" width="110" height="40" fill="url(#scan)"/>
        <rect x="0" y="-2" width="110" height="2" fill="#ffb84d"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 172" dur="3s" repeatCount="indefinite"/>
      </g>
    </g>

    <use href="#shield" fill="none" stroke="#ff9900" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="55" cy="58" r="13" fill="#ff9900"/>
    <path d="M48 64 L44 92 H66 L62 64 Z" fill="#ff9900"/>
  </g>

  <rect x="518" y="85" width="2" height="130" fill="url(#divider)"/>

  <!-- título en dos niveles -->
  <text x="554" y="148" font-family="Menlo, Consolas, monospace" font-size="66" font-weight="bold" fill="#f8fafc">AWS IAM</text>
  <text x="558" y="196" font-family="Menlo, Consolas, monospace" font-size="28" letter-spacing="9" fill="#94a3b8">SECURITY LAB</text>
</svg>
