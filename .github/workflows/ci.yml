name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo lectura: el CI comprueba código, no despliega nada
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0

      # Falla si algún .tf no está formateado, sin modificar nada
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [academy]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0

      # Sin backend ni credenciales: solo descarga el provider para validar la sintaxis y los tipos
      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  mkdocs-build:
    name: MkDocs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # WeasyPrint necesita Pango para generar el PDF
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install MkDocs
        run: pip install -r requirements.txt

      # --strict convierte los avisos (enlaces rotos, snippets que faltan) en errores
      - name: Build site and PDF
        run: mkdocs build --strict
        env:
          ENABLE_PDF_EXPORT: 1
